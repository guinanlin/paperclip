services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: paperclip
      POSTGRES_DB: paperclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: .
    ports:
      - "4100:3100"
    environment:
      DATABASE_URL: postgres://paperclip:paperclip@db:5432/paperclip
      PORT: "3100"
      HOST: "0.0.0.0"
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: "local_trusted"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_LOCAL_TRUSTED_ALLOW_NON_LOOPBACK_BIND: "true"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:4100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-}"
    volumes:
      - paperclip-data:/paperclip
      # Agent/project workspace paths often use host absolute dirs (e.g. /media/.../projects/foo).
      # Mount the whole projects tree at the same path inside the container.
      - "${PAPERCLIP_HOST_PROJECTS_ROOT:-/media/ctyun/datadisk1/projects}:/media/ctyun/datadisk1/projects"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  paperclip-data:
